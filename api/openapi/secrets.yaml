openapi: 3.0.3
info:
  title: Secrets API (OpenBao-shaped subset)
  version: 1.0.0
  description: >
    Narrow subset of an OpenBao-shaped credential-issuance API. This plan's
    secrets-mock implements a static pre-provisioned bot-token pool rather
    than real per-invocation minting/revocation (see
    docs/plans/active/orchestrator-control-plane-mvp.md, Decision 5).
servers:
  - url: http://secrets-mock:8080
paths:
  /credentials:
    post:
      operationId: issueCredential
      summary: Issue a scoped credential for one invocation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialRequest'
      responses:
        '201':
          description: Credential issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
  /credentials/{id}:
    delete:
      operationId: revokeCredential
      summary: Revoke a previously issued credential.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Credential revoked.
  /webhook-secrets/{owner}/{name}:
    get:
      operationId: getWebhookSecret
      summary: >
        Get a repo's per-repo Forgejo webhook HMAC secret (docs/designs/next/
        full-pipeline-async-approval-design.md §4.4/§7) — a long-lived shared
        secret, not a per-invocation minted credential, but still sourced
        from a static pre-provisioned pool the same way bot tokens are.
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Webhook secret found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSecret'
        '404':
          description: No webhook secret provisioned for this repo.
components:
  schemas:
    CredentialRequest:
      type: object
      required: [invocation_id, bot_account, target_repo, scopes, ttl_seconds]
      properties:
        invocation_id:
          type: string
        bot_account:
          type: string
        target_repo:
          type: string
        scopes:
          type: array
          items:
            type: string
        ttl_seconds:
          type: integer
          description: Serialized form of the Go client's time.Duration TTL.
    WebhookSecret:
      type: object
      required: [secret]
      properties:
        secret:
          type: string
    Credential:
      type: object
      required: [id, token, expires_at, scopes]
      properties:
        id:
          type: string
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        scopes:
          type: array
          items:
            type: string
