# Observability pipeline (platform-observability design §11, PR D):
# OTel Collector → Prometheus (remote write) / Loki (OTLP) / Tempo (OTLP),
# Grafana on top, Alertmanager with a null receiver.
#
# Pulled into docker-compose.yml with a top-level `include:` (Compose ≥ 2.20),
# so every `docker compose -f deploy/docker-compose.yml …` command manages
# these services too. Config lives in deploy/observability/<service>/.
#
# Every port is published on host loopback only: none of these UIs/APIs has
# authentication yet (design §11 PR G / Q10). No service here receives a
# database DSN (SEC-5).
#
# Image tags are pinned exactly (design §17); docs/local-development.md §7
# lists them. Never use `latest`.

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  alertmanager-data:

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    ports:
      # OTLP from processes running on the host (e.g. the real
      # container-launcher via docker-compose.real-launcher.yml's setup).
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    networks: [orchestrator-net]

  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Retention (CC-3, provisional value — design §11).
      - --storage.tsdb.retention.time=30d
      # The Collector pushes metrics here (prometheus_remote_write exporter).
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [orchestrator-net]

  alertmanager:
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks: [orchestrator-net]

  loki:
    image: grafana/loki:3.7.9
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks: [orchestrator-net]

  tempo:
    image: grafana/tempo:2.10.10
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./observability/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    networks: [orchestrator-net]

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
      - tempo
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme-local-only}
      # Local only: read-only browsing without logging in.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Forgejo already has host :3000.
      - "127.0.0.1:3030:3000"
    networks: [orchestrator-net]
