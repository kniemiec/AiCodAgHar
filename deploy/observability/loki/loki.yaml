# Loki, single process (platform-observability design §11, LG-3…LG-5).
# Logs arrive over OTLP from the Collector. Index labels are only
# service.name, host.name and deployment.environment (plus Loki's derived
# level); task_id, round, step_id, invocation_id and trace_id stay
# structured metadata, queried as `| task_id="<id>"`
# (deploy/observability/task-logs.sh).

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  # Retention (CC-3, provisional): 14 days, enforced by the compactor.
  retention_period: 336h
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes: [service.name, host.name, deployment.environment]

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
