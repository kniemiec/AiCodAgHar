# Per-host OpenTelemetry Collector (platform-observability design §11).
# Both binaries export OTLP/gRPC here (OTEL_EXPORTER_OTLP_ENDPOINT); the
# Collector fans out to the backends. In production each host runs its own
# Collector with these exporters pointed at the observability host, so all
# traffic is outbound from the hosts (CC-8).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # First in every pipeline: refuse data instead of OOMing when a backend
  # stalls. The SDKs drop on a full queue, so a task never waits on this.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch: {}

exporters:
  # Loki ≥ 3 native OTLP ingest. Resource attributes become index labels
  # per loki/config.yaml; log attributes (task_id, round, step_id,
  # invocation_id, trace_id, …) become structured metadata.
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus_remote_write:
    endpoint: http://prometheus:9090/api/v1/write
    # Copy the identifying resource attributes onto every series as
    # service_name, host_name, deployment_environment, so each one names its
    # component and host (CC-8). The other resource attributes (SDK name,
    # version, …) stay on target_info only.
    resource_constant_labels:
      included: [service.name, host.name, deployment.environment]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus_remote_write]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo]
  telemetry:
    # The Collector's own metrics, scraped by Prometheus (job otel-collector;
    # SLO-9's `up` check).
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
