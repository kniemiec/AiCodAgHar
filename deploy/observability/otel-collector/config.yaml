# Per-host OpenTelemetry Collector (platform-observability design §11).
# Both binaries export OTLP here (OTEL_EXPORTER_OTLP_ENDPOINT); every
# exporter pushes outbound — logs to Loki, traces to Tempo, metrics to
# Prometheus remote_write — so a host needs no inbound telemetry port.
# In production, point the three exporter endpoints at the observability
# host; nothing else changes.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch: {}

exporters:
  # Loki's native OTLP endpoint; it appends /v1/logs.
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  # Nothing emits traces until PR E; the pipeline is wired so it is ready.
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true
    # service.name / host.name / deployment.environment label every series
    # (CC-8), so one host's or one component's series can be selected.
    resource_constant_labels:
      included: [service.name, host.name, deployment.environment]

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
