# Prometheus (platform-observability design §11). Application metrics arrive
# by remote write from the OTel Collector (--web.enable-remote-write-receiver);
# the scrape jobs below only cover the pipeline's own components, so
# `up{job=~"loki|tempo|otel-collector"}` exists for SLO-9.
# Retention is the --storage.tsdb.retention.time flag in
# docker-compose.observability.yml (30d, CC-3).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Alert rules and their promtool tests arrive in PR F.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
