# Prometheus (platform-observability design §11). Application metrics arrive
# by remote_write from the Collector (--web.enable-remote-write-receiver);
# the scrape jobs below only watch the pipeline itself, so SLO-9's
# up{job=~"loki|tempo|otel-collector"} has series to look at.
# Retention (CC-3, provisional): --storage.tsdb.retention.time in
# deploy/docker-compose.observability.yml.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
