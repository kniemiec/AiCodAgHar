# Tempo, single binary on the local filesystem (platform-observability design
# §11). Nothing emits spans until tracing lands (PR E); the backend is here so
# the pipeline is complete (CC-7).

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    # Retention (CC-3, provisional value — design §11): 7 days.
    block_retention: 168h

usage_report:
  reporting_enabled: false
